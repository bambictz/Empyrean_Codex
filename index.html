 v.querySelectorAll("[data-al]").forEach(b=>b.addEventListener("click",()=>{charState.align=b.dataset.al;v.querySelectorAll("[data-al]").forEach(x=>x.setAttribute("aria-pressed",x===b));fill()}));
 function card(c){return `<article class="card" id="c-${c.id}" tabindex="-1">
  <div class="card-top"><h3>${esc(c.name)}</h3><div class="pills">${c.marked?`<span class="pill p-mark">Marked</span>`:""}${alignPill(c.align)}${statusPill(c.status)}</div></div>

 function fill(){const q=charState.q.toLowerCase();

let famFocus=null;
function famInfo(id){const c=C[id];if(c)return{name:c.name,sub:c.dragons.length?c.dragons.map(nm).join(" + "):(c.status==="dead"?"Deceased":""),dead:c.status==="dead",align:c.align};const x=FAMX[id];return{name:x?.name||id,sub:x?.note||"",dead:false}}
function renderFamily(){
 const v=$("#view");
 v.innerHTML=`<p class="eyebrow">Bloodlines & fostering</p><h2>Family Tree</h2>
 <p class="lede">Tap anyone to focus their family: relatives light up and the rest fade. Tap again or the background to clear.</p>
 <div class="legend"><span><i style="background:var(--fam)"></i>Parent / child</span><span><i style="background:var(--love)"></i>Spouse / consort</span><span><i style="background:var(--ally);opacity:.8"></i>Sibling or foster</span></div>
 <div class="split"><div class="stage" id="fstage"></div><aside class="panel" id="fpanel"></aside></div>`;
 const cw=$("#fstage").clientWidth||760,narrow=cw<700;
 const W=narrow?cw:760,colGap=narrow?Math.floor((W-16)/3):150,boxW=narrow?colGap-10:132,boxH=46;
 const nameFit=id=>{const n=famInfo(id).name.replace(/^(General|Colonel \(later General\)|Prince|King|Duke) /,"").replace(/ \(.*\)/,"");return narrow&&n.length*7.4>boxW-8?n.split(" ")[0]:n.slice(0,20)};
 const subMax=narrow?Math.floor(boxW/6.2):22;
 let y=20,parts=[],nodes={},edges=[];
 FAMILIES.forEach(f=>{
  parts.push(`<text x="16" y="${y+14}" style="font-family:var(--display);font-size:17px;fill:var(--bronze)">${esc(f.name)}</text>`);y+=30;
  f.gens.forEach(gen=>{const total=gen.length*colGap;const x0=Math.max(16,(W-total)/2);
   gen.forEach((id,i)=>{nodes[id]={x:x0+i*colGap+(narrow?5:0),y,fam:f.name}});y+=boxH+40});
  (f.links||[]).forEach(l=>edges.push([...l,"fam"]));(f.spouse||[]).forEach(l=>edges.push([...l,"love"]));
  (f.sib||[]).forEach(l=>edges.push([...l,"ally"]));(f.foster||[]).forEach(l=>edges.push([...l,"ally"]));
  y+=10});
 const H=y;
 const adj={};edges.forEach(([a,b])=>{(adj[a]??=new Set).add(b);(adj[b]??=new Set).add(a)});
 // siblings: share a parent
 const parents={};edges.filter(e=>e[2]==="fam").forEach(([p,c])=>(parents[c]??=[]).push(p));
 Object.keys(parents).forEach(c=>Object.keys(parents).forEach(d=>{if(c!==d&&parents[c].some(p=>parents[d].includes(p))){adj[c].add(d)}}));
 const path=(a,b,t)=>{const A=nodes[a],B=nodes[b];if(!A||!B)return"";
  const ax=A.x+boxW/2,bx=B.x+boxW/2;
  if(t==="fam")return`M${ax},${A.y+boxH} C${ax},${A.y+boxH+22} ${bx},${B.y-22} ${bx},${B.y}`;
  if(A.fam!==B.fam){return""}
  return`M${A.x+boxW},${A.y+boxH/2} L${B.x},${B.y+boxH/2}`};
 const edgeSvg=edges.map(([a,b,t])=>{const d=path(a,b,t);return d?`<path class="edge" data-a="${a}" data-b="${b}" d="${d}" stroke="var(--${t})" ${t!=="fam"?'stroke-dasharray="5 4"':""}/>`:""}).join("");
 const nodeSvg=Object.entries(nodes).map(([id,n])=>{const i=famInfo(id);return`<g class="node ${i.dead?"dead":""}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(i.name)}" transform="translate(${n.x},${n.y})"><rect width="${boxW}" height="${boxH}" rx="5"/><text x="${boxW/2}" y="19" text-anchor="middle" style="font-weight:700;font-size:13px">${esc(nameFit(id))}</text><text x="${boxW/2}" y="35" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${esc(((i.dead?"† ":"")+i.sub).slice(0,subMax))}</text></g>`}).join("");
 $("#fstage").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Family tree">${parts.join("")}${edgeSvg}${nodeSvg}</svg>`;
 const panel=$("#fpanel");
 function focus(id){famFocus=id;
  const svg=$("#fstage svg");svg.querySelectorAll(".node").forEach(g=>{const k=g.dataset.id;g.classList.toggle("focus",k===id);g.classList.toggle("near",!!id&&adj[id]?.has(k));g.classList.toggle("dim",!!id&&k!==id&&!adj[id]?.has(k))});
  svg.querySelectorAll(".edge").forEach(e=>e.classList.toggle("dim",!!id&&e.dataset.a!==id&&e.dataset.b!==id));
  panel.classList.toggle("idle",!id);
  if(!id){panel.innerHTML=`<p class="eyebrow">No one selected</p><p style="margin:6px 0 0;color:var(--muted)">Pick a name in the tree to see their parents, children, siblings and partners.</p>`;return}
  const i=famInfo(id),c=C[id];
  const rel=edges.filter(e=>e[0]===id||e[1]===id).map(([a,b,t])=>{const o=a===id?b:a;const lbl=t==="love"?"Partner":t==="ally"?"Sibling / foster":(a===id?"Child":"Parent");return`<li><span class="eyebrow" style="display:inline-block;min-width:96px">${lbl}</span>${C[o]?`<button class="lnk" data-ff="${o}">${esc(nm(o))}</button>`:esc(nm(o))}</li>`});
  const sibs=[...(adj[id]||[])].filter(o=>parents[id]&&parents[o]&&parents[id].some(p=>parents[o].includes(p))).map(o=>`<li><span class="eyebrow" style="display:inline-block;min-width:96px">Sibling</span><button class="lnk" data-ff="${o}">${esc(nm(o))}</button></li>`);
  panel.innerHTML=`<button class="sheet-close" data-close>Close</button><p class="eyebrow">Focused</p><h3>${esc(i.name)}</h3>${c?`<div class="pills" style="justify-content:flex-start;margin-top:6px">${alignPill(c.align)}${statusPill(c.status)}</div>`:""}<p style="margin:8px 0 0;color:var(--muted);font-size:.92rem">${esc(c?c.conn:i.sub)}</p><ul>${rel.join("")}${sibs.join("")}</ul>${c?`<p style="margin-top:12px"><button class="lnk" data-go="char:${id}">Full profile</button> · <button class="lnk" data-go="map:${id}">Connections map</button></p>`:""}`}
 $("#fstage").addEventListener("click",e=>{const g=e.target.closest(".node");focus(g&&g.dataset.id!==famFocus?g.dataset.id:null)});
 $("#fstage").addEventListener("keydown",e=>{const g=e.target.closest(".node");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();focus(g.dataset.id===famFocus?null:g.dataset.id)}});
 panel.addEventListener("click",e=>{if(e.target.closest("[data-close]"))return focus(null);const b=e.target.closest("[data-ff]");if(b){focus(b.dataset.ff);const n=$(`#fstage .node[data-id="${b.dataset.ff}"]`);n?.scrollIntoView({block:"center",inline:"center",behavior:"smooth"})}});
 if(narrow){focus(famFocus&&nodes[famFocus]?famFocus:null)}
 else{focus(famFocus&&nodes[famFocus]?famFocus:"violet");
 requestAnimationFrame(()=>{const n=$(`#fstage .node[data-id="${famFocus}"]`);if(n&&famFocus!=="violet")n.scrollIntoView({block:"center",inline:"center"})})}
}

/* ============ CONNECTIONS MAP ============ */
let mapFocus=null,mapLayout=null,showDragons=store.get("mapDragons",false);
function layout(nodes,links,W,H,narrow){
 const REP=narrow?2600:5200,LEN=narrow?78:110,PADX=narrow?42:60;
 const P={};nodes.forEach((n,i)=>{const a=i/nodes.length*Math.PI*2;P[n]={x:W/2+Math.cos(a)*W*.35,y:H/2+Math.sin(a)*H*.35,vx:0,vy:0}});
 P.violet&&(P.violet.x=W/2,P.violet.y=H/2);
 for(let it=0;it<420;it++){const t=1-it/420;
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=P[nodes[i]],b=P[nodes[j]];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=REP/d2;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
  links.forEach(([s,tg])=>{const a=P[s],b=P[tg];if(!a||!b)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-LEN)*.02;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
  nodes.forEach(n=>{const p=P[n];p.vx+=(W/2-p.x)*.004;p.vy+=(H/2-p.y)*.004;p.x+=p.vx*t*.5;p.y+=p.vy*t*.5;p.vx*=.6;p.vy*=.6;p.x=Math.max(PADX,Math.min(W-PADX,p.x));p.y=Math.max(30,Math.min(H-30,p.y))})}
 return P}
function renderMap(){
 const v=$("#view");
 v.innerHTML=`<p class="eyebrow">Who is tied to whom</p><h2>Connections Map</h2>
 <p class="lede">Tap a person to light up everyone they're connected to and see how.</p>
 <div class="controls"><button class="chip" id="mdr" aria-pressed="${showDragons}">Show dragon bonds</button>
 <select id="mpick" aria-label="Focus a character"><option value="">Focus a character…</option>${CHARS.filter(c=>EDGES.some(e=>e[0]===c.id||e[1]===c.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
 <div class="legend"><span><i style="background:var(--fam)"></i>Family</span><span><i style="background:var(--love)"></i>Romance</span><span><i style="background:var(--friend)"></i>Friends</span><span><i style="background:var(--ally)"></i>Allies / mentors</span><span><i style="background:var(--foe)"></i>Enemies / rivals</span>${showDragons?`<span><i style="background:var(--bond)"></i>Dragon bond</span>`:""}</div>
 <div class="split"><div class="stage" id="mstage"></div><aside class="panel" id="mpanel"></aside></div>`;
 const cw=$("#mstage").clientWidth||980,narrow=cw<700;
 let links=EDGES.map(e=>[...e]);
 const people=[...new Set(links.flatMap(e=>[e[0],e[1]]))];
 let nodes=[...people];
 if(showDragons){CHARS.forEach(c=>{if(people.includes(c.id))c.dragons.forEach(d=>{if(!nodes.includes(d))nodes.push(d);links.push([c.id,d,"bond","bonded"])})});links.push(["tairn","sgaeyl","love","mates"])}
 const W=narrow?cw:980,H=narrow?Math.round(nodes.length*30+220):760;
 const P=layout(nodes,links,W,H,narrow);
 const adj={};links.forEach(([a,b])=>{(adj[a]??=new Set).add(b);(adj[b]??=new Set).add(a)});
 const edgeSvg=links.map(([a,b,t])=>`<line class="edge" data-a="${a}" data-b="${b}" x1="${P[a].x}" y1="${P[a].y}" x2="${P[b].x}" y2="${P[b].y}" stroke="var(--${t})" ${t==="foe"?'stroke-dasharray="6 4"':""}/>`).join("");
 const nodeSvg=nodes.map(id=>{const isD=!!D[id]&&!C[id],p=P[id],c=C[id],label=isD?D[id].name:short(id);const w=Math.max(54,label.length*7.4+18);
  return isD?`<g class="node isdragon" data-id="${id}" tabindex="0" role="button" aria-label="${esc(label)} (dragon)" transform="translate(${p.x},${p.y})"><circle r="15" style="stroke:${COLORS[D[id].color]==COLORS.irid?"#b88be8":COLORS[D[id].color]}"/><text y="30" text-anchor="middle" style="font-size:11px;font-style:italic">${esc(label)}</text></g>`
  :`<g class="node ${c?.status==="dead"?"dead":""}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(nm(id))}" transform="translate(${p.x-w/2},${p.y-14})"><rect width="${w}" height="28" rx="14" style="stroke:var(--${c?.align==="bad"?"foe":c?.align==="grey"?"fam":"line"})"/><text x="${w/2}" y="18.5" text-anchor="middle" style="font-size:13px;font-weight:700">${c?.status==="dead"?"† ":""}${esc(label)}</text></g>`}).join("");
 $("#mstage").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Character connections">${edgeSvg}${nodeSvg}</svg>`;
 const panel=$("#mpanel");
 function focus(id){mapFocus=id;$("#mpick").value=C[id]?id:"";
  const svg=$("#mstage svg");svg.querySelectorAll(".node").forEach(g=>{const k=g.dataset.id;g.classList.toggle("focus",k===id);g.classList.toggle("near",!!id&&adj[id]?.has(k));g.classList.toggle("dim",!!id&&k!==id&&!adj[id]?.has(k))});
  svg.querySelectorAll(".edge").forEach(e=>e.classList.toggle("dim",!!id&&e.dataset.a!==id&&e.dataset.b!==id));
  panel.classList.toggle("idle",!id);
  if(!id){panel.innerHTML=`<p class="eyebrow">No one selected</p><p style="margin:6px 0 0;color:var(--muted)">Tap a name on the map, or choose one above.</p>`;return}
  const rows=links.filter(e=>e[0]===id||e[1]===id).map(([a,b,t,l])=>{const o=a===id?b:a;return`<li><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--${t});margin-right:8px"></i><button class="lnk" data-mf="${o}">${esc(nm(o))}</button> <span style="color:var(--muted)">· ${esc(l)}</span></li>`});
  const c=C[id],d=D[id];
  panel.innerHTML=`<button class="sheet-close" data-close>Close</button><p class="eyebrow">${d&&!c?"Dragon":"Focused"}</p><h3>${esc(nm(id))}</h3>${c?`<div class="pills" style="justify-content:flex-start;margin-top:6px">${c.marked?`<span class="pill p-mark">Marked</span>`:""}${alignPill(c.align)}${statusPill(c.status)}</div>`:""}<ul>${rows.join("")}</ul><p style="margin-top:12px">${c?`<button class="lnk" data-go="char:${id}">Full profile</button> · <button class="lnk" data-go="fam:${id}">Family tree</button>`:d?`<button class="lnk" data-go="dragon:${id}">Dragon profile</button>`:""}</p>`}
 const center=id=>{const n=$(`#mstage .node[data-id="${id}"]`);n?.scrollIntoView({block:"center",inline:"center",behavior:"smooth"})};
 $("#mstage").addEventListener("click",e=>{const g=e.target.closest(".node");focus(g&&g.dataset.id!==mapFocus?g.dataset.id:null)});
 $("#mstage").addEventListener("keydown",e=>{const g=e.target.closest(".node");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();focus(g.dataset.id===mapFocus?null:g.dataset.id)}});
 panel.addEventListener("click",e=>{if(e.target.closest("[data-close]"))return focus(null);const b=e.target.closest("[data-mf]");if(b){focus(b.dataset.mf);center(b.dataset.mf)}});
 $("#mpick").addEventListener("change",e=>{focus(e.target.value||null);if(e.target.value)center(e.target.value)});
 $("#mdr").addEventListener("click",()=>{showDragons=!showDragons;store.set("mapDragons",showDragons);renderMap()});
 if(narrow){focus(mapFocus&&P[mapFocus]?mapFocus:null);if(mapFocus&&P[mapFocus])requestAnimationFrame(()=>center(mapFocus))}
 else{const start=mapFocus&&P[mapFocus]?mapFocus:"violet";focus(start);requestAnimationFrame(()=>{const n=$(`#mstage .node[data-id="${start}"]`);n?.scrollIntoView({block:"center",inline:"center"})})}
}

/* ============ GLOBAL SEARCH ============ */
const INDEX=[
 ...CHARS.map(c=>({k:"Character",t:c.name,s:[c.signet[0],c.dragons.map(nm).join(" + ")].filter(Boolean).join(" · "),hay:[c.name,c.assign,c.wing,c.section,c.squad,c.signet.join(" "),c.dragons.map(nm).join(" "),c.conn,c.agenda,c.death].join(" "),go:"char:"+c.id})),
 ...DRAGONS.map(d=>({k:"Dragon",t:d.name,s:`${d.color} ${d.tail}${d.rider?" · "+nm(d.rider):""}`,hay:[d.name,d.full,d.color,d.tail,nm(d.rider),d.notes,d.prev.map(p=>p.who).join(" ")].join(" "),go:"dragon:"+d.id})),
 ...SIGNETS.map((s,i)=>({k:"Signet",t:s.sig,s:s.who.map(nm).join(", "),hay:[s.sig,s.what,s.who.map(nm).join(" ")].join(" "),go:"sig:"+i})),
 ...CODEX.map((r,i)=>({k:"Codex",t:r.t,s:r.art,hay:[r.t,r.d,r.art].join(" "),go:"law:cx-"+i})),
 ...DLAWS.map((r,i)=>({k:"Dragon law",t:r.t,s:r.art,hay:[r.t,r.d,r.art].join(" "),go:"law:dl-"+i}))
];
const gq=$("#gq"),gres=$("#gres");let gi=-1;
function gsearch(){const q=gq.value.trim().toLowerCase();gi=-1;if(q.length<2){gres.hidden=true;return}
 const terms=q.split(/\s+/);
 const hits=INDEX.map(x=>{const h=x.hay.toLowerCase(),t=x.t.toLowerCase();if(!terms.every(w=>h.includes(w)))return null;return{...x,score:(t.startsWith(q)?3:0)+(t.includes(q)?2:0)+(x.k==="Character"?.5:0)}}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,14);
 gres.innerHTML=hits.length?hits.map(h=>`<button data-gg="${h.go}"><span class="k">${h.k}</span><span><b>${esc(h.t)}</b><br><span class="s">${esc(h.s)}</span></span></button>`).join(""):`<div style="padding:12px;color:var(--muted)">Nothing found for “${esc(gq.value)}”.</div>`;
 gres.hidden=false}
gq.addEventListener("input",gsearch);gq.addEventListener("focus",gsearch);
gq.addEventListener("keydown",e=>{const bs=[...gres.querySelectorAll("button")];if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();gi=(gi+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs[gi]?.focus()}else if(e.key==="Enter"&&bs[0]){bs[0].click()}else if(e.key==="Escape"){gres.hidden=true}});
gres.addEventListener("keydown",e=>{const bs=[...gres.querySelectorAll("button")];const i=bs.indexOf(document.activeElement);if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();bs[(i+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length]?.focus()}else if(e.key==="Escape"){gres.hidden=true;gq.focus()}});
gres.addEventListener("click",e=>{const b=e.target.closest("[data-gg]");if(b){gres.hidden=true;gq.blur();go(b.dataset.gg)}});
document.addEventListener("click",e=>{if(!e.target.closest(".gsearch"))gres.hidden=true});

renderTabs();show(current);
</script>
